"새 투표·사녹 공지는 사이트에 자동으로 올라와요. 홈 화면에 추가해 두고 자주 확인해 주세요":
  en: "New votes and pre-recording notices appear here automatically. Add the site to your home screen and check often"
  ja: "新しい投票・事前収録の告知はサイトに自動で載ります。ホーム画面に追加してこまめにチェックしてください"
  zh: "新的投票和预录公告会自动更新到网站。把网站添加到主屏幕，常来看看"
  es: "Las nuevas votaciones y avisos de pregrabación aparecen aquí solos. Añade el sitio a tu pantalla de inicio y revisa seguido"
  id: "Voting dan pengumuman pra-rekaman baru muncul otomatis di sini. Tambahkan ke layar utama dan sering cek ya"
  th: "โหวตและประกาศพรีเรคใหม่จะขึ้นที่เว็บอัตโนมัติ เพิ่มไว้ที่หน้าจอโฮมแล้วเข้ามาเช็กบ่อยๆ"
