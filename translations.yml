  th: "วิธีโหวตสำหรับแฟนต่างประเทศ"
  pt: "Como votar (fãs internacionais)"
"응원 탭 '투표'(또는 한눈에 탭 맨 위)에서 어떤 앱인지·마감 시간을 확인 — 사이트의 시간은 모두 한국 시간(KST)":
  en: "Check which app and the deadline under Votes in Support (or at the top of Home) — all times on this site are Korea time (KST)"
  ja: "応援タブの「投票」（またはホームの一番上）でアプリと締切を確認 — サイトの時間はすべて韓国時間（KST）"
  zh: "在「应援」的投票（或首页最上方）确认用哪个App和截止时间 — 本站时间均为韩国时间（KST）"
  es: "Revisa la app y la fecha límite en Votaciones (Apoyo) o arriba en Inicio — todas las horas son de Corea (KST)"
  id: "Cek aplikasi dan batas waktunya di Voting (tab Dukungan) atau paling atas Beranda — semua waktu di situs ini waktu Korea (KST)"
  th: "ดูว่าใช้แอปไหนและปิดโหวตเมื่อไรที่ 'โหวต' ในแท็บซัพพอร์ต (หรือบนสุดของหน้าหลัก) — เวลาบนเว็บเป็นเวลาเกาหลี (KST)"
  pt: "Veja qual é o app e o prazo em 'Votações' na aba Apoio (ou no topo do Início) — todos os horários do site são de Coreia (KST)"
"위 표에서 앱 이름을 눌러 설치 → 구글·애플·이메일 계정으로 가입 (한국 전화번호 없이 가입되는 앱이 많아요)":
  en: "Tap an app name in the table above to install it, then sign up with Google, Apple or email (most apps don't need a Korean phone number)"
  ja: "上の表のアプリ名をタップしてインストール → Google・Apple・メールで登録（韓国の電話番号なしで登録できるアプリが多いです）"
  zh: "点上表中的App名称安装 → 用Google、Apple或邮箱注册（很多App不需要韩国手机号）"
  es: "Toca el nombre de la app en la tabla para instalarla y regístrate con Google, Apple o correo (la mayoría no pide número coreano)"
  id: "Ketuk nama aplikasi di tabel atas untuk memasang, lalu daftar dengan Google, Apple, atau email (banyak aplikasi tidak perlu nomor Korea)"
  th: "แตะชื่อแอปในตารางด้านบนเพื่อติดตั้ง แล้วสมัครด้วย Google, Apple หรืออีเมล (หลายแอปไม่ต้องใช้เบอร์เกาหลี)"
  pt: "Toque no nome do app na tabela acima para instalar e cadastre-se com Google, Apple ou e-mail (a maioria não pede número coreano)"
"출석·광고·미션으로 투표권을 미리 모아 두고, 투표 기간에 A2O SOUL에 투표":
  en: "Collect votes in advance through check-ins, ads and missions, then vote for A2O SOUL during the voting period"
  ja: "出席・広告・ミッションで投票券を事前に貯めて、投票期間にA2O SOULへ投票"
  zh: "通过签到、看广告、做任务提前攒票，投票期间投给A2O SOUL"
  es: "Junta votos antes con asistencias, anuncios y misiones, y vota por A2O SOUL durante el periodo"
  id: "Kumpulkan vote lebih dulu lewat absen, iklan dan misi, lalu vote A2O SOUL saat periode voting"
  th: "สะสมสิทธิ์โหวตล่วงหน้าจากการเช็กอิน ดูโฆษณา และภารกิจ แล้วโหวตให้ A2O SOUL ในช่วงโหวต"
  pt: "Junte votos com antecedência com check-ins, anúncios e missões, e vote no A2O SOUL durante o período"
"생방송 투표는 방송 시간(KST)에만 열려요 — 방송 일정은 한눈에 탭 달력에서":
  en: "Live votes only open during the broadcast (KST) — see the calendar on Home for show times"
  ja: "生放送投票は放送時間（KST）だけ開きます — 放送日程はホームのカレンダーで"
  zh: "直播投票只在播出时间（KST）开放 — 播出日程见首页日历"
  es: "La votación en vivo solo se abre durante la emisión (KST) — mira el calendario en Inicio"
  id: "Voting live hanya dibuka saat siaran (KST) — lihat jadwal di kalender Beranda"
  th: "โหวตสดเปิดเฉพาะช่วงออกอากาศ (KST) — ดูเวลาในปฏิทินหน้าหลัก"
  pt: "A votação ao vivo só abre durante a transmissão (KST) — veja os horários no calendário do Início"
"새 투표·사녹 공지는 사이트에 자동으로 올라와요. 홈 화면에 추가해 두고 자주 확인해 주세요":
  en: "New votes and pre-recording notices appear here automatically. Add the site to your home screen and check often"
  ja: "新しい投票・事前収録の告知はサイトに自動で載ります。ホーム画面に追加してこまめにチェックしてください"
  zh: "新的投票和预录公告会自动更新到网站。把网站添加到主屏幕，常来看看"
  es: "Las nuevas votaciones y avisos de pregrabación aparecen aquí solos. Añade el sitio a tu pantalla de inicio y revisa seguido"
  id: "Voting dan pengumuman pra-rekaman baru muncul otomatis di sini. Tambahkan ke layar utama dan sering cek ya"
  th: "โหวตและประกาศพรีเรคใหม่จะขึ้นที่เว็บอัตโนมัติ เพิ่มไว้ที่หน้าจอโฮมแล้วเข้ามาเช็กบ่อยๆ"
  pt: "Novas votações e avisos de pré-gravação aparecem aqui automaticamente. Adicione o site à tela de início e confira sempre"
