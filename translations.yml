생방송 중 앱 실시간 투표 배너:
  en: Live voting banner in the app during the broadcast
  ja: 生放送中にアプリのリアルタイム投票バナー
  zh: 直播期间App内实时投票横幅
  es: Banner de votación en vivo en la app durante la emisión
  id: Banner voting live di aplikasi saat siaran
앱 미션·광고로 모은 재화로 투표:
  en: Vote with in-app currency earned from missions and ads
  ja: アプリのミッション・広告で集めたポイントで投票
  zh: 用App任务·广告获得的道具投票
  es: Vota con la moneda que ganas en misiones y anuncios
  id: Vote pakai poin dari misi dan iklan di aplikasi
생방송 투표는 계정당 최대 5표:
  en: 'Live voting: up to 5 votes per account'
  ja: 生放送投票は1アカウント最大5票
  zh: 直播投票每个账号最多5票
  es: 'Votación en vivo: hasta 5 votos por cuenta'
  id: 'Voting live: maks. 5 suara per akun'
음원 사이트 (멜론·지니·벅스·FLO·바이브):
  en: Music sites (Melon, Genie, Bugs, FLO, VIBE)
  ja: 音源サイト（Melon・Genie・Bugs・FLO・VIBE）
  zh: 音源网站（Melon·Genie·Bugs·FLO·VIBE）
  es: Sitios de música (Melon, Genie, Bugs, FLO, VIBE)
  id: Situs musik (Melon, Genie, Bugs, FLO, VIBE)
해당 사이트 스트리밍 이용권으로 로그인한 상태에서 재생:
  en: Play while logged in with a streaming pass for that site
  ja: そのサイトのストリーミング利用券でログインした状態で再生
  zh: 使用该网站的流媒体会员登录后播放
  es: Reproduce con sesión iniciada y un pase de streaming de ese sitio
  id: Putar sambil login dengan paket streaming situs itu
음소거·볼륨 0 말고 작게라도 소리 켜기:
  en: Don't mute or set volume to 0 — keep the sound on, even low
  ja: ミュートや音量0にせず、小さくても音を出す
  zh: 不要静音或音量调0，小声也要开着
  es: 'No silencies ni pongas el volumen a 0: déjalo bajo pero encendido'
  id: Jangan mute atau volume 0 — nyalakan walau pelan
한 곡 반복보다 다른 곡을 섞은 재생목록으로 (응원 탭 스밍 리스트 참고):
  en: Use a playlist mixed with other songs instead of repeating one track (see the streaming list in the Support tab)
  ja: 1曲リピートより他の曲を混ぜたプレイリストで（応援タブのストリーミングリスト参照）
  zh: 比起单曲循环，用混合其他歌曲的歌单（参考应援页的打榜歌单）
  es: Usa una lista con otras canciones en vez de repetir una (mira la lista de streaming en Apoyo)
  id: Pakai playlist campuran, bukan ulang satu lagu (lihat daftar streaming di tab Dukung)
여러 기기에서 같은 계정으로 동시에 돌리지 않기:
  en: Don't stream on multiple devices with the same account at once
  ja: 同じアカウントで複数の端末から同時に再生しない
  zh: 不要用同一账号在多台设备同时播放
  es: No uses la misma cuenta en varios dispositivos a la vez
  id: Jangan streaming di banyak perangkat dengan akun yang sama sekaligus
유튜브 뮤직비디오 조회수:
  en: YouTube MV views
  ja: YouTube MV再生回数
  zh: YouTube MV播放量
  es: Vistas del MV en YouTube
  id: Penayangan MV YouTube
로그인한 상태에서 MV를 끝까지 보기:
  en: Watch the MV to the end while logged in
  ja: ログインした状態でMVを最後まで見る
  zh: 登录状态下完整观看MV
  es: Mira el MV completo con sesión iniciada
  id: Tonton MV sampai habis sambil login
같은 MV만 연속 반복하지 말고 다른 영상(무대·직캠)을 사이에 섞기:
  en: Don't loop the same MV — mix in other videos (stages, fancams)
  ja: 同じMVだけを連続リピートせず、他の動画（ステージ・直カム）を挟む
  zh: 不要只循环同一MV，中间穿插其他视频（舞台·直拍）
  es: 'No repitas solo el mismo MV: intercala otros videos (presentaciones, fancams)'
  id: Jangan ulang MV yang sama terus — selingi video lain (panggung, fancam)
좋아요·댓글·공유도 함께:
  en: Like, comment and share too
  ja: いいね・コメント・共有も一緒に
  zh: 也要点赞·评论·分享
  es: Dale me gusta, comenta y comparte
  id: Jangan lupa like, komen, dan share
재생목록은 공식 채널 영상 위주로:
  en: Build playlists mainly from official channel videos
  ja: プレイリストは公式チャンネルの動画中心で
  zh: 歌单以官方频道视频为主
  es: Arma listas sobre todo con videos de canales oficiales
  id: Playlist utamakan video dari kanal resmi
음방 투표 공통:
  en: Music show voting basics
  ja: 音楽番組投票の共通ポイント
  zh: 打歌节目投票通用
  es: 'Votaciones de programas musicales: lo básico'
  id: Dasar voting acara musik
투표 기간은 응원 탭 '투표'에서 확인 (마감 임박하면 빨갛게 표시):
  en: Check voting periods under 'Votes' in the Support tab (shown in red when closing soon)
  ja: 投票期間は応援タブの「投票」で確認（締切間近は赤で表示）
  zh: 投票时间在应援页“投票”中查看（即将截止时显示为红色）
  es: Consulta los plazos en 'Votaciones' de la pestaña Apoyo (en rojo si cierran pronto)
  id: Cek periode voting di 'Voting' tab Dukung (merah jika hampir berakhir)
대부분 앱 미션·광고로 투표권을 모으니 미리 모아 두기:
  en: Most apps give votes through missions and ads — collect them in advance
  ja: 多くはアプリのミッション・広告で投票権を集めるので事前に貯めておく
  zh: 大多数App通过任务·广告获得投票券，记得提前攒
  es: 'La mayoría de apps dan votos por misiones y anuncios: acumúlalos antes'
  id: Kebanyakan aplikasi kasih vote lewat misi dan iklan — kumpulkan dari awal
투표 앱·방식이 자주 바뀌니 공식 공지도 같이 확인:
  en: Voting apps and rules change often — check official notices too
  ja: 投票アプリや方式はよく変わるので公式告知も確認
  zh: 投票App和规则常有变化，请同时查看官方公告
  es: 'Las apps y reglas cambian a menudo: revisa también los avisos oficiales'
  id: Aplikasi dan aturan voting sering berubah — cek juga pengumuman resmi
