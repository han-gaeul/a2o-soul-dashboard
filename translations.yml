  en: His soul food is jjajangmyeon
  ja: ソウルフードはジャージャー麺
  zh: 灵魂食物是炸酱面
  es: Su comida favorita es el jjajangmyeon
  id: Soul food-nya jjajangmyeon
빈티지 옷을 직접 리폼해서 입음:
  en: Remakes vintage clothes himself
  ja: 古着を自分でリメイクして着る
  zh: 会亲手改造古着来穿
  es: Él mismo transforma ropa vintage
  id: Me-reform sendiri baju vintage
축구·농구를 좋아하는 운동파:
  en: Sporty — loves soccer and basketball
  ja: サッカー・バスケが好きなスポーツ派
  zh: 运动派，喜欢足球和篮球
  es: 'Deportista: le encantan el fútbol y el baloncesto'
  id: Suka olahraga — sepak bola dan basket
팀에서 가장 차분한 성격:
  en: The calmest personality on the team
  ja: グループで一番落ち着いた性格
  zh: 团内性格最沉稳
  es: La personalidad más tranquila del grupo
  id: Kepribadian paling tenang di tim
네오 소울을 좋아함 (최애 아티스트 에리카 바두):
  en: 'Loves neo soul (favorite artist: Erykah Badu)'
  ja: ネオソウルが好き（推しアーティストはエリカ・バドゥ）
  zh: 喜欢新灵魂乐（最爱歌手Erykah Badu）
  es: 'Le encanta el neo soul (artista favorita: Erykah Badu)'
  id: 'Suka neo soul (artis favorit: Erykah Badu)'
파워풀한 음색:
  en: Powerful vocal tone
  ja: パワフルな歌声
  zh: 有力量的音色
  es: Timbre potente
  id: Warna suara yang powerful
발라드를 좋아함 (최애곡 EXO 'For Life'):
  en: 'Loves ballads (favorite song: EXO ''For Life'')'
  ja: バラードが好き（好きな曲はEXO『For Life』）
  zh: 喜欢抒情歌（最爱歌曲EXO《For Life》）
  es: 'Le encantan las baladas (canción favorita: EXO ''For Life'')'
  id: 'Suka balada (lagu favorit: EXO ''For Life'')'
초등학생 때 밴드를 결성해 싱글 발매:
  en: Formed a band in elementary school and released a single
  ja: 小学生のときにバンドを結成しシングルをリリース
  zh: 小学时组过乐队并发行单曲
  es: Formó una banda en primaria y lanzó un sencillo
  id: Membentuk band saat SD dan merilis single
시티워크를 좋아함:
  en: Loves city walks
  ja: 街歩きが好き
  zh: 喜欢City Walk
  es: Le encanta pasear por la ciudad
  id: Suka jalan-jalan keliling kota
매력 포인트는 '동굴 보이스' 저음:
  en: His charm point is his deep 'cave voice'
  ja: チャームポイントは「洞窟ボイス」の低音
  zh: 魅力点是“洞穴音”低音
  es: 'Su encanto: su voz grave tipo ''cueva'''
  id: Daya tariknya suara bass 'cave voice'
팀의 분위기 메이커:
  en: The team's mood maker
  ja: グループのムードメーカー
  zh: 团内气氛担当
  es: El que anima el ambiente del grupo
  id: Mood maker tim
일본어·한국어·영어·중국어 4개 국어:
  en: 'Speaks 4 languages: Japanese, Korean, English and Chinese'
  ja: 日本語・韓国語・英語・中国語の4か国語
  zh: 会日语、韩语、英语、中文四种语言
  es: 'Habla 4 idiomas: japonés, coreano, inglés y chino'
  id: 'Menguasai 4 bahasa: Jepang, Korea, Inggris, Mandarin'
보컬로 입사해 짧은 기간에 댄스 실력을 크게 끌어올림:
  en: Joined as a vocalist and quickly leveled up his dancing
  ja: ボーカルとして入社し、短期間でダンス力を大きく伸ばした
  zh: 以声乐身份加入，短时间内舞蹈实力大幅提升
  es: Entró como vocalista y mejoró mucho su baile en poco tiempo
  id: Masuk sebagai vokalis dan cepat meningkatkan kemampuan dance
팝·R&B를 좋아함:
  en: Loves pop and R&B
  ja: ポップ・R&Bが好き
  zh: 喜欢流行和R&B
  es: Le encantan el pop y el R&B
  id: Suka pop dan R&B
스스로를 '황금 올라운더'로 소개:
  en: Introduces himself as the 'golden all-rounder'
  ja: 自らを「黄金オールラウンダー」と紹介
  zh: 自称“黄金全能型”
  es: Se presenta como el 'todoterreno dorado'
  id: Menyebut dirinya 'golden all-rounder'
가볍고 정확한 춤선:
  en: Light, precise dance lines
  ja: 軽やかで正確なダンスライン
  zh: 轻盈精准的舞蹈线条
  es: Líneas de baile ligeras y precisas
  id: Garis dance ringan dan presisi
'''SUPERSTAR'' 1·2절 도입부 담당':
  en: Opens the 1st and 2nd verses of 'SUPERSTAR'
  ja: 『SUPERSTAR』1・2番の導入パート担当
  zh: 负责《SUPERSTAR》第一、二段开头
  es: Abre la 1.ª y 2.ª estrofa de 'SUPERSTAR'
  id: Pembuka verse 1 & 2 di 'SUPERSTAR'
사진 촬영을 좋아해 레트로 감성용 구형 휴대폰을 따로 씀:
  en: Loves taking photos — keeps an old phone just for retro-style shots
  ja: 写真好きでレトロな雰囲気用に古いスマホを別に使う
  zh: 喜欢拍照，专门用旧手机拍复古感照片
  es: 'Le encanta la fotografía: usa un móvil viejo para fotos retro'
  id: Suka foto — pakai HP lama khusus untuk nuansa retro
시원시원한 큰 춤선:
  en: Big, bold dance lines
  ja: のびのびとした大きなダンスライン
  zh: 大开大合的舞蹈线条
  es: Líneas de baile amplias y enérgicas
  id: Garis dance besar dan lepas
자주 쓰는 말은 "Lit!":
  en: His catchphrase is "Lit!"
  ja: 口癖は「Lit!」
  zh: 口头禅是“Lit!”
  es: Su muletilla es "Lit!"
  id: Kata andalannya "Lit!"
소울메이트로 맏형 문을 꼽음:
  en: Calls eldest member MOON his soulmate
  ja: ソウルメイトに最年長のMOONを挙げた
  zh: 称大哥MOON为灵魂伴侣
  es: Considera a MOON, el mayor, su alma gemela
  id: Menyebut MOON, member tertua, sebagai soulmate-nya
15명의 소년은 모든 것이 갖춰진 행성 SOULITE(소울라이트)에서 왔어요.:
  en: The 15 boys come from SOULITE, a planet where everything is provided.
  ja: 15人の少年は、すべてがそろった惑星SOULITE（ソウルライト）からやって来ました。
  zh: 15位少年来自应有尽有的星球SOULITE。
  es: Los 15 chicos vienen de SOULITE, un planeta donde no falta nada.
  id: 15 pemuda ini berasal dari SOULITE, planet yang serba lengkap.
그런데도 무언가 비어 있다고 느낀 이들은, 사람을 살아 있게 하는 감정과 에너지 — 기쁨·사랑·설렘·열정, 곧 '소울(SOUL)'을 찾아 지구로 떠나요.:
  en: 'Still feeling something missing, they set off for Earth to find the emotions and energy that make people feel alive — joy, love, excitement and passion: ''SOUL''.'
  ja: それでも何かが足りないと感じた彼らは、人を生き生きとさせる感情とエネルギー——喜び・愛・ときめき・情熱、つまり「SOUL」を探しに地球へ旅立ちます。
  zh: 即便如此仍觉得缺了点什么的他们，为了寻找让人鲜活的情感与能量——喜悦、爱、心动、热情，也就是“SOUL”，出发前往地球。
  es: 'Aun así sentían que algo faltaba, así que viajan a la Tierra en busca de las emociones y la energía que hacen sentir vivas a las personas —alegría, amor, emoción y pasión—: el ''SOUL''.'
  id: 'Merasa ada yang kosong, mereka pergi ke Bumi untuk mencari emosi dan energi yang membuat manusia hidup — bahagia, cinta, debar, gairah: ''SOUL''.'
데뷔 앨범 'SUPERSTAR'가 그 이야기의 첫 번째 챕터. 그룹은 자신들의 음악을 'NEW SYNTHWAVE'라고 불러요.:
  en: The debut album 'SUPERSTAR' is the first chapter of that story. The group calls its music 'NEW SYNTHWAVE'.
  ja: デビューアルバム『SUPERSTAR』がその物語の第1章。グループは自分たちの音楽を「NEW SYNTHWAVE」と呼んでいます。
  zh: 出道专辑《SUPERSTAR》是这个故事的第一章。他们把自己的音乐称为“NEW SYNTHWAVE”。
  es: El álbum debut 'SUPERSTAR' es el primer capítulo de esa historia. El grupo llama a su música 'NEW SYNTHWAVE'.
  id: Album debut 'SUPERSTAR' adalah bab pertama cerita itu. Grup ini menyebut musik mereka 'NEW SYNTHWAVE'.
