  ja: デビューアルバム『SUPERSTAR』がその物語の第1章。グループは自分たちの音楽を「NEW SYNTHWAVE」と呼んでいます。
  zh: 出道专辑《SUPERSTAR》是这个故事的第一章。他们把自己的音乐称为“NEW SYNTHWAVE”。
  es: El álbum debut 'SUPERSTAR' es el primer capítulo de esa historia. El grupo llama a su música 'NEW SYNTHWAVE'.
