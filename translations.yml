"첫날 목표: Dancing in the Dark 10만 스트리밍 · SUPERSTAR EP 전체 20만":
  en: "Day 1 goals: 100K streams for Dancing in the Dark · 200K for the whole SUPERSTAR EP"
  ja: "初日の目標：Dancing in the Dark 10万回・SUPERSTAR EP全体で20万回"
  zh: "首日目标：Dancing in the Dark 10 万播放 · SUPERSTAR EP 合计 20 万"
  es: "Metas del día 1: 100K streams de Dancing in the Dark · 200K para todo el EP SUPERSTAR"
  id: "Target hari 1: 100 ribu stream Dancing in the Dark · 200 ribu untuk seluruh EP SUPERSTAR"
  th: "เป้าหมายวันแรก: Dancing in the Dark 100K สตรีม · ทั้ง EP SUPERSTAR 200K"
