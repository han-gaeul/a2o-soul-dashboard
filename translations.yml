"1시간 재생목록: Dancing in the Dark 다음에 다른 곡 2개(수록곡 1 + 다른 가수 곡 1)를 넣는 순서로":
  en: "1-hour playlist: after each Dancing in the Dark, add 2 different songs (1 EP B-side + 1 song by another artist)"
  ja: "1時間の再生リスト：Dancing in the Darkの後に別の曲を2曲（収録曲1＋他アーティストの曲1）"
  zh: "1 小时歌单：每首 Dancing in the Dark 之后放 2 首不同的歌（1 首收录曲 + 1 首其他歌手的歌）"
  es: "Playlist de 1 hora: después de cada Dancing in the Dark, 2 canciones distintas (1 del EP + 1 de otro artista)"
  id: "Playlist 1 jam: setiap setelah Dancing in the Dark, tambahkan 2 lagu berbeda (1 B-side EP + 1 lagu artis lain)"
  th: "เพลย์ลิสต์ 1 ชม.: หลัง Dancing in the Dark แต่ละครั้ง ใส่เพลงอื่น 2 เพลง (B-side ใน EP 1 + เพลงศิลปินอื่น 1)"
  pt: "Playlist de 1 hora: depois de cada Dancing in the Dark, 2 músicas diferentes (1 do EP + 1 de outro artista)"
  fil: "1-hour playlist: pagkatapos ng bawat Dancing in the Dark, 2 ibang kanta (1 EP B-side + 1 kanta ng ibang artist)"
  vi: "Playlist 1 giờ: sau mỗi lần Dancing in the Dark, thêm 2 bài khác (1 B-side trong EP + 1 bài của nghệ sĩ khác)"

"한 곡 반복·셔플은 끄고 재생목록 순서대로 듣기":
  en: "Turn off single-song repeat and shuffle — play the playlist in order"
  ja: "1曲リピートとシャッフルはオフにして、再生リスト順に聴く"
  zh: "关闭单曲循环和随机播放 — 按歌单顺序播放"
  es: "Desactiva la repetición de una canción y el aleatorio — reproduce la playlist en orden"
  id: "Matikan repeat satu lagu dan shuffle — putar playlist sesuai urutan"
  th: "ปิดเล่นซ้ำเพลงเดียวและสุ่มเพลง — เล่นตามลำดับเพลย์ลิสต์"
  pt: "Desligue a repetição de uma música e o aleatório — toque a playlist em ordem"
  fil: "I-off ang single-song repeat at shuffle — patugtugin ang playlist nang sunod-sunod"
  vi: "Tắt lặp một bài và phát ngẫu nhiên — nghe playlist theo thứ tự"

"Spotify 앱 볼륨 50% 이상, 앱 음소거 금지 — 조용히 들으려면 이어폰으로":
  en: "Keep the Spotify app volume above 50% and never mute the app — use headphones if you need quiet"
  ja: "Spotifyアプリの音量は50%以上、アプリのミュートは禁止。静かにしたい時はイヤホンで"
  zh: "Spotify 应用音量保持 50% 以上，不要静音应用 — 想安静就戴耳机"
  es: "Mantén el volumen de la app de Spotify por encima del 50% y no la silencies — usa auriculares si necesitas silencio"
  id: "Volume aplikasi Spotify di atas 50% dan jangan di-mute — pakai earphone kalau perlu senyap"
  th: "ตั้งเสียงแอป Spotify เกิน 50% และห้ามปิดเสียงแอป — ถ้าอยากเงียบให้ใช้หูฟัง"
  pt: "Deixe o volume do app do Spotify acima de 50% e nunca silencie o app — use fones se precisar de silêncio"
  fil: "Panatilihing higit 50% ang volume ng Spotify app at huwag i-mute — gumamit ng headphones kung kailangan ng tahimik"
  vi: "Giữ âm lượng app Spotify trên 50% và không tắt tiếng app — cần yên lặng thì dùng tai nghe"

"한 시간에 한 번쯤 재생목록을 바꾸거나 곡을 직접 넘겨서 활동 중임을 보여 주기":
  en: "About once an hour, switch playlists or skip a track manually so you're not flagged as a bot"
  ja: "1時間に1回くらい再生リストを変えたり手動で曲を飛ばしたりして、操作していることを示す"
  zh: "大约每小时切换一次歌单或手动切歌，避免被判定为机器人"
  es: "Más o menos cada hora, cambia de playlist o salta una canción a mano para que no te marquen como bot"
  id: "Kira-kira sejam sekali, ganti playlist atau skip lagu secara manual supaya tidak dianggap bot"
  th: "ประมาณชั่วโมงละครั้ง ให้เปลี่ยนเพลย์ลิสต์หรือกดข้ามเพลงเอง จะได้ไม่ถูกมองว่าเป็นบอต"
  pt: "Mais ou menos uma vez por hora, troque de playlist ou pule uma música manualmente para não ser marcado como bot"
  fil: "Mga isang beses kada oras, magpalit ng playlist o mag-skip ng kanta nang manual para hindi ma-flag bilang bot"
  vi: "Khoảng mỗi giờ một lần, đổi playlist hoặc tự bấm chuyển bài để không bị coi là bot"

"같은 계정으로 여러 기기에서 동시에 재생하지 않기":
  en: "Don't play on multiple devices with the same account at the same time"
  ja: "同じアカウントで複数の端末から同時に再生しない"
  zh: "不要用同一账号在多台设备上同时播放"
  es: "No reproduzcas con la misma cuenta en varios dispositivos a la vez"
  id: "Jangan putar dengan akun yang sama di beberapa perangkat sekaligus"
  th: "อย่าเล่นด้วยบัญชีเดียวกันบนหลายเครื่องพร้อมกัน"
  pt: "Não toque com a mesma conta em vários aparelhos ao mesmo tempo"
  fil: "Huwag magpatugtog gamit ang parehong account sa maraming device nang sabay"
  vi: "Không phát cùng một tài khoản trên nhiều thiết bị cùng lúc"

