그런데도 무언가 비어 있다고 느낀 이들은, 사람을 살아 있게 하는 감정과 에너지 — 기쁨·사랑·설렘·열정, 곧 '소울(SOUL)'을 찾아 지구로 떠나요.:
  en: 'Still feeling something missing, they set off for Earth to find the emotions and energy that make people feel alive — joy, love, excitement and passion: ''SOUL''.'
  ja: それでも何かが足りないと感じた彼らは、人を生き生きとさせる感情とエネルギー——喜び・愛・ときめき・情熱、つまり「SOUL」を探しに地球へ旅立ちます。
  zh: 即便如此仍觉得缺了点什么的他们，为了寻找让人鲜活的情感与能量——喜悦、爱、心动、热情，也就是“SOUL”，出发前往地球。
  es: 'Aun así sentían que algo faltaba, así que viajan a la Tierra en busca de las emociones y la energía que hacen sentir vivas a las personas —alegría, amor, emoción y pasión—: el ''SOUL''.'
  id: 'Merasa ada yang kosong, mereka pergi ke Bumi untuk mencari emosi dan energi yang membuat manusia hidup — bahagia, cinta, debar, gairah: ''SOUL''.'
  th: แต่ก็ยังรู้สึกว่าขาดบางอย่าง พวกเขาจึงออกเดินทางมายังโลกเพื่อตามหาอารมณ์และพลังที่ทำให้คนรู้สึกมีชีวิต — ความสุข ความรัก ความตื่นเต้น และความหลงใหล นั่นคือ 'SOUL'
데뷔 앨범 'SUPERSTAR'가 그 이야기의 첫 번째 챕터. 그룹은 자신들의 음악을 'NEW SYNTHWAVE'라고 불러요.:
