"유료 이용권이나 무료 체험 중인 계정으로 (아이폰·안드로이드·윈도우·웹 모두 OK) — 자동 재생(∞)은 끄기":
  en: "Use a paid plan or free trial (iPhone, Android, Windows or web all work) — turn off Autoplay (∞)"
  ja: "有料プランか無料トライアル中のアカウントで（iPhone・Android・Windows・Web可）。自動再生(∞)はオフ"
  zh: "使用付费会员或免费试用账号（iPhone、安卓、Windows、网页均可）— 关闭自动播放（∞）"
  es: "Usa un plan de pago o la prueba gratis (iPhone, Android, Windows o web) — desactiva la reproducción automática (∞)"
  id: "Pakai paket berbayar atau uji coba gratis (iPhone, Android, Windows, atau web) — matikan Autoplay (∞)"
  th: "ใช้แพ็กเกจแบบเสียเงินหรือช่วงทดลองฟรี (iPhone, Android, Windows หรือเว็บ) — ปิดเล่นอัตโนมัติ (∞)"
  pt: "Use um plano pago ou o teste grátis (iPhone, Android, Windows ou web) — desligue a reprodução automática (∞)"
