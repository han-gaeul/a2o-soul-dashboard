  pt: "Ordem de exemplo: Dancing in the Dark · SUPERSTAR · música curta · Dancing in the Dark · While We're Young · Very First Love · Dancing in the Dark · Moonlight Shadow · outra música curta"
  fil: "Halimbawang order: Dancing in the Dark · SUPERSTAR · maikling filler · Dancing in the Dark · While We're Young · Very First Love · Dancing in the Dark · Moonlight Shadow · ibang maikling filler"
  vi: "Thứ tự mẫu: Dancing in the Dark · SUPERSTAR · bài ngắn khác · Dancing in the Dark · While We're Young · Very First Love · Dancing in the Dark · Moonlight Shadow · một bài ngắn khác"

"곡을 건너뛰거나 넘기지 말고 끝까지, 볼륨 50% 이상(또는 이어폰)":
  en: "Play each track to the end without skipping or scrubbing, with volume above 50% (or earphones)"
  ja: "飛ばしたりシークしたりせず最後まで、音量は50%以上（またはイヤホン）"
  zh: "每首歌完整播放，不要跳过或拖动进度，音量 50% 以上（或戴耳机）"
  es: "Escucha cada canción completa sin saltar ni adelantar, con el volumen por encima del 50% (o auriculares)"
  id: "Putar sampai habis tanpa skip atau geser, volume di atas 50% (atau pakai earphone)"
  th: "ฟังจนจบเพลงโดยไม่ข้ามหรือเลื่อน ตั้งเสียงเกิน 50% (หรือใช้หูฟัง)"
  pt: "Ouça cada faixa até o fim sem pular nem avançar, com volume acima de 50% (ou fones)"
  fil: "Patugtugin hanggang dulo nang walang skip o scrub, volume higit 50% (o earphones)"
  vi: "Nghe hết mỗi bài, không bỏ qua hay tua, âm lượng trên 50% (hoặc dùng tai nghe)"

"VPN 금지, 한 IP에서 여러 계정 돌리지 않기":
  en: "No VPN, and don't run multiple accounts on one IP"
  ja: "VPNは使わず、1つのIPで複数アカウントを回さない"
