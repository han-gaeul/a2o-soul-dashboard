"내 상황과 연결해서 진심을 담아 쓰기 (출근길·시험 기간·오늘 있었던 일 등) — 같은 문구 복붙은 피하기":
  en: "Write sincerely and tie it to your own life (commute, exams, something from today) — avoid copy-pasting the same text"
  ja: "自分の状況とつなげて心を込めて（通勤中・試験期間・今日の出来事など）— 同じ文面のコピペは避けて"
  zh: "结合自己的情况真诚地写（通勤路上·考试期间·今天发生的事等）— 避免复制粘贴相同内容"
  es: "Escribe con sinceridad y relaciónalo con tu vida (camino al trabajo, exámenes, algo de hoy); evita copiar y pegar el mismo texto"
  id: "Tulis dengan tulus dan kaitkan dengan keadaanmu (perjalanan kerja, masa ujian, kejadian hari ini) — hindari copy-paste teks yang sama"
  th: "เขียนอย่างจริงใจและเชื่อมกับชีวิตตัวเอง (ระหว่างไปทำงาน ช่วงสอบ เรื่องวันนี้) — อย่าก๊อปข้อความเดียวกัน"
  pt: "Escreva com sinceridade e ligue à sua vida (trajeto, provas, algo de hoje) — evite copiar e colar o mesmo texto"
"타이틀곡·수록곡 가리지 않고 — 라디오는 Dancing in the Dark보다 수록곡 반응이 더 좋을 수 있어요":
  en: "Any song is fine, title or B-side — on radio, B-sides may land better than Dancing in the Dark"
  ja: "タイトル曲・収録曲どちらでもOK — ラジオではDancing in the Darkより収録曲の方が反応が良いことも"
  zh: "主打曲·收录曲都可以 — 电台听众可能对收录曲反应比Dancing in the Dark更好"
  es: "Vale cualquier canción, sencillo o B-side; en la radio las B-sides pueden funcionar mejor que Dancing in the Dark"
  id: "Lagu utama atau B-side sama-sama boleh — di radio, B-side bisa lebih disukai daripada Dancing in the Dark"
