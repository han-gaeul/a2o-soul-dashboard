  es: "Playlist de streaming de 1 hora de A2O SOUL"
  id: "Playlist streaming 1 jam A2O SOUL"
  th: "เพลย์ลิสต์สตรีม 1 ชั่วโมงของ A2O SOUL"
  pt: "Playlist de streaming de 1 hora do A2O SOUL"
"음원 차트는 '몇 번 들었나'보다 '몇 명이 들었나'를 봐요. 한 곡만 반복하지 말고 이 1시간짜리 리스트를 순서대로 계속 돌려 주세요.":
  en: "Korean music charts care more about how many people listen than how many times. Don't loop one song — keep playing this 1-hour list in order."
  ja: "韓国の音源チャートは「何回聴いたか」より「何人が聴いたか」を重視します。1曲リピートではなく、この1時間リストを順番に回し続けてください。"
  zh: "韩国音源榜更看重“多少人听”而不是“听了几遍”。不要单曲循环，请按顺序一直播放这份1小时歌单。"
  es: "Las listas coreanas cuentan más cuántas personas escuchan que cuántas veces. No repitas una sola canción: reproduce esta lista de 1 hora en orden."
  id: "Chart musik Korea lebih melihat berapa orang yang mendengar daripada berapa kali. Jangan ulang satu lagu — putar playlist 1 jam ini berurutan terus."
  th: "ชาร์ตเพลงเกาหลีดูว่ามีกี่คนฟังมากกว่าฟังกี่รอบ อย่าวนเพลงเดียว ให้เปิดเพลย์ลิสต์ 1 ชั่วโมงนี้ตามลำดับไปเรื่อยๆ"
  pt: "As paradas coreanas contam mais quantas pessoas ouvem do que quantas vezes. Não repita uma música só — toque esta lista de 1 hora em ordem, sem parar."
"지금 활동곡 Dancing in the Dark를 맨 앞에 — 리스트가 돌 때마다 한 번씩 확실히 들어가게":
  en: "Put the current promo track Dancing in the Dark first — so it plays every time the list loops"
  ja: "今の活動曲 Dancing in the Dark を一番最初に — リストが一周するたびに必ず1回入るように"
  zh: "把当前主打 Dancing in the Dark 放在第一首 — 每循环一次都一定会播到"
  es: "Pon primero la canción de promoción actual, Dancing in the Dark — así suena en cada vuelta"
  id: "Taruh lagu promosi sekarang, Dancing in the Dark, paling awal — supaya pasti terputar tiap putaran"
  th: "ใส่เพลงโปรโมต Dancing in the Dark ไว้เป็นเพลงแรก จะได้ถูกเล่นทุกรอบ"
  pt: "Coloque a música de promoção atual, Dancing in the Dark, em primeiro — assim ela toca a cada volta"
"수록곡 5곡을 모두 넣기 — 앨범 전곡 이용자 수가 앨범 순위·음방 음원 점수에 도움":
  en: "Include all 5 album tracks — listeners across the whole album help album rankings and music show digital scores"
  ja: "収録曲5曲すべてを入れる — アルバム全曲の利用者数がアルバム順位・音楽番組の音源点数に効きます"
  zh: "收录曲5首都放进去 — 全专辑的收听人数有助于专辑排名和打歌节目的音源分"
  es: "Incluye las 5 canciones del álbum — los oyentes de todo el álbum ayudan al ranking y a la puntuación digital en los programas"
  id: "Masukkan kelima lagu album — jumlah pendengar seluruh album membantu peringkat album dan skor digital di acara musik"
  th: "ใส่ครบทั้ง 5 เพลงในอัลบั้ม จำนวนคนฟังทั้งอัลบั้มช่วยอันดับอัลบั้มและคะแนนดิจิทัลในรายการเพลง"
  pt: "Inclua as 5 faixas do álbum — ouvintes do álbum inteiro ajudam no ranking e na pontuação digital dos programas musicais"
"사이사이 다른 곡은 지금 차트 상위권 곡으로 — 같은 가수만 연속 재생하면 비정상 재생으로 걸러질 수 있어요":
  en: "Fill the gaps with current top-chart songs — playing only one artist back-to-back can be filtered as abnormal streaming"
  ja: "合間の曲は今のチャート上位曲で — 同じ歌手だけを連続再生すると異常再生として除外されることがあります"
  zh: "中间穿插当前榜单靠前的歌 — 只连续播放同一歌手可能被判定为异常播放而被过滤"
  es: "Rellena los huecos con éxitos actuales — reproducir solo un artista seguido puede filtrarse como streaming anormal"
  id: "Isi selanya dengan lagu chart teratas sekarang — memutar satu artis saja berturut-turut bisa tersaring sebagai streaming tidak wajar"
  th: "เพลงคั่นให้ใช้เพลงที่ติดชาร์ตตอนนี้ ถ้าเปิดแต่ศิลปินเดียวติดกันอาจถูกกรองว่าเป็นการสตรีมผิดปกติ"
  pt: "Preencha os intervalos com sucessos atuais — tocar só um artista em sequência pode ser filtrado como streaming anormal"
"셔플 끄고 순서대로, 볼륨 0·음소거 말고 작게라도 소리 켜기":
  en: "Shuffle off, play in order, and keep the sound on (not muted or at 0), even if quiet"
  ja: "シャッフルはオフで順番どおり、音量0・ミュートではなく小さくても音を出す"
  zh: "关闭随机播放按顺序，不要静音或音量0，小声也要开着"
  es: "Sin aleatorio, en orden, y con el sonido encendido (ni silencio ni volumen 0), aunque sea bajo"
  id: "Matikan shuffle, putar berurutan, dan nyalakan suara (jangan mute/volume 0) walau kecil"
  th: "ปิดสุ่ม เล่นตามลำดับ และเปิดเสียงไว้ (ไม่ปิดเสียง/ไม่เป็น 0) ถึงจะเบาก็ได้"
  pt: "Sem aleatório, em ordem, e com o som ligado (sem mudo ou volume 0), mesmo baixo"
"곡마다 하트(좋아요) 누르기, 이용권 있는 음원 사이트가 여러 개면 사이트마다 각각":
  en: "Tap the heart (like) on each song, and if you have passes on several music sites, stream on each"
  ja: "曲ごとにハート（いいね）を押す、利用券のある音源サイトが複数あればサイトごとに"
  zh: "每首歌都点爱心（喜欢），如果有多个音源网站的会员，每个网站都放"
  es: "Da corazón (me gusta) a cada canción y, si tienes suscripción en varios sitios, reproduce en cada uno"
  id: "Tekan hati (suka) di setiap lagu, dan kalau punya langganan di beberapa situs musik, putar di masing-masing"
  th: "กดหัวใจ (ถูกใจ) ทุกเพลง และถ้ามีแพ็กเกจหลายเว็บก็เปิดแยกทุกเว็บ"
  pt: "Toque no coração (curtir) em cada música e, se tiver assinatura em vários sites, toque em cada um"
"해외 팬은 Spotify·Apple Music·YouTube Music에서 — 국내 차트엔 안 들어가지만 글로벌 차트·바이럴 차트에 반영돼요":
  en: "Global fans: use Spotify, Apple Music or YouTube Music — they don't count toward Korean charts but do count for global and viral charts"
  ja: "海外ファンは Spotify・Apple Music・YouTube Music で — 韓国チャートには入りませんが、グローバル・バイラルチャートに反映されます"
  zh: "海外粉丝用 Spotify·Apple Music·YouTube Music — 不计入韩国榜单，但会计入全球榜和病毒榜"
  es: "Fans internacionales: usen Spotify, Apple Music o YouTube Music — no cuentan para las listas coreanas pero sí para las globales y virales"
  id: "Fans luar negeri: pakai Spotify, Apple Music, atau YouTube Music — tidak masuk chart Korea, tapi masuk chart global dan viral"
  th: "แฟนต่างประเทศใช้ Spotify, Apple Music หรือ YouTube Music ไม่นับในชาร์ตเกาหลี แต่นับในชาร์ตโกลบอลและไวรัล"
  pt: "Fãs internacionais: usem Spotify, Apple Music ou YouTube Music — não contam para as paradas coreanas, mas contam para as globais e virais"
