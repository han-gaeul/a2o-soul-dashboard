  pt: "Sem VPN, e não use várias contas no mesmo IP"
  fil: "Bawal ang VPN, at huwag gumamit ng maraming account sa iisang IP"
  vi: "Không dùng VPN, không chạy nhiều tài khoản trên một IP"

