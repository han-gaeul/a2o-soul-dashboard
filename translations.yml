  vi: "Dùng gói trả phí hoặc dùng thử miễn phí (iPhone, Android, Windows hoặc web) — tắt Tự động phát (∞)"

"아이튠즈로 구매해서 내려받은 곡은 지우고 스트리밍으로 듣기":
  en: "Delete purchased iTunes downloads and stream instead"
  ja: "iTunesで購入してダウンロードした曲は削除して、ストリーミングで聴く"
  zh: "删除在 iTunes 购买下载的歌曲，用流媒体播放"
  es: "Borra las descargas compradas en iTunes y escucha por streaming"
  id: "Hapus lagu yang dibeli & diunduh dari iTunes, lalu streaming"
  th: "ลบเพลงที่ซื้อและดาวน์โหลดจาก iTunes แล้วฟังแบบสตรีมแทน"
  pt: "Apague as músicas compradas e baixadas no iTunes e ouça por streaming"
  fil: "Burahin ang mga biniling iTunes download at mag-stream na lang"
  vi: "Xóa bài đã mua và tải về từ iTunes rồi nghe bằng streaming"

"한 곡 반복 금지 — 타이틀곡 사이에 다른 곡 2~3개(약 5~6분)를 넣은 1~2시간 재생목록으로":
  en: "Never loop one song — use a 1–2 hour playlist with 2–3 other songs (about 5–6 minutes) between title-track plays"
  ja: "1曲リピート禁止。タイトル曲の間に他の曲を2〜3曲（約5〜6分）挟んだ1〜2時間の再生リストで"
  zh: "不要单曲循环 — 用 1～2 小时的歌单，每首主打之间放 2～3 首其他歌（约 5～6 分钟）"
  es: "Nunca repitas una canción — usa una playlist de 1–2 horas con 2–3 canciones distintas (unos 5–6 minutos) entre cada title track"
  id: "Jangan loop satu lagu — pakai playlist 1–2 jam dengan 2–3 lagu lain (sekitar 5–6 menit) di antara title track"
  th: "ห้ามวนเพลงเดียว — ใช้เพลย์ลิสต์ 1–2 ชม. ที่มีเพลงอื่น 2–3 เพลง (ราว 5–6 นาที) คั่นระหว่างเพลงหลัก"
  pt: "Nunca deixe uma música em loop — use uma playlist de 1–2 horas com 2–3 outras músicas (uns 5–6 minutos) entre cada faixa-título"
  fil: "Huwag i-loop ang isang kanta — gumamit ng 1–2 oras na playlist na may 2–3 ibang kanta (mga 5–6 minuto) sa pagitan ng title track"
  vi: "Không lặp một bài — dùng playlist 1–2 giờ, xen 2–3 bài khác (khoảng 5–6 phút) giữa các lần phát bài chủ đề"

"예시 순서: Dancing in the Dark · SUPERSTAR · 짧은 다른 곡 · Dancing in the Dark · While We're Young · Very First Love · Dancing in the Dark · Moonlight Shadow · 다른 짧은 곡":
