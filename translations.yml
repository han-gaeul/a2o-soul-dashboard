  es: "Meta por hora: 50K vistas/hora el día 1, 45K/hora los días 2–7 (250K al día)"
  id: "Target per jam: 50 ribu views/jam di hari 1, 45 ribu/jam di hari 2–7 (250 ribu sehari)"
  th: "เป้าหมายรายชั่วโมง: วันแรก 50K วิว/ชม. วันที่ 2–7 45K วิว/ชม. (วันละ 250K)"
  pt: "Meta por hora: 50K views/hora no dia 1, 45K/hora nos dias 2–7 (250K por dia)"
  fil: "Hourly goal: 50K views/oras sa day 1, 45K/oras sa day 2–7 (250K kada araw)"
  vi: "Mục tiêu mỗi giờ: ngày 1 là 50K view/giờ, ngày 2–7 là 45K/giờ (250K mỗi ngày)"

"MV만 반복하지 말고 사이에 다른 영상 2~3개(또는 팬 재생목록)를 섞기":
  en: "Don't loop the MV — watch 2–3 other videos (or a fan playlist) in between"
  ja: "MVだけを繰り返さず、間に他の動画を2〜3本（またはファンの再生リスト）挟む"
  zh: "不要只循环 MV — 中间穿插 2～3 个其他视频（或粉丝歌单）"
  es: "No repitas el MV en bucle — mira 2–3 videos distintos (o una playlist de fans) entre medias"
  id: "Jangan loop MV — tonton 2–3 video lain (atau playlist fans) di antaranya"
  th: "อย่าวน MV ซ้ำ — ดูวิดีโออื่น 2–3 คลิป (หรือเพลย์ลิสต์ของแฟน) คั่นระหว่างรอบ"
  pt: "Não deixe o MV em loop — assista 2–3 outros vídeos (ou uma playlist de fãs) entre uma vez e outra"
  fil: "Huwag i-loop ang MV — manood ng 2–3 ibang video (o fan playlist) sa pagitan"
  vi: "Đừng lặp MV liên tục — xem 2–3 video khác (hoặc playlist của fan) xen giữa"

"영상 볼륨은 50% 이상 — 소리를 줄이려면 유튜브 플레이어 말고 휴대폰·컴퓨터 볼륨으로":
  en: "Keep the video volume above 50% — to keep it quiet, lower your phone/computer volume, not the YouTube player"
  ja: "動画の音量は50%以上に。静かにしたい時はYouTubeプレーヤーではなく端末の音量を下げる"
  zh: "视频音量保持在 50% 以上 — 想安静就调低手机/电脑音量，而不是 YouTube 播放器"
  es: "Mantén el volumen del video por encima del 50% — para silenciar, baja el volumen del móvil/PC, no el del reproductor"
  id: "Volume video di atas 50% — kalau mau senyap, kecilkan volume HP/komputer, bukan pemutar YouTube"
  th: "ตั้งเสียงวิดีโอเกิน 50% — ถ้าอยากให้เงียบ ให้ลดเสียงที่มือถือ/คอมแทน ไม่ใช่ที่เพลเยอร์ YouTube"
  pt: "Deixe o volume do vídeo acima de 50% — para ficar em silêncio, abaixe o volume do celular/PC, não o do player"
  fil: "Panatilihing higit 50% ang volume ng video — kung gusto ng tahimik, hinaan ang phone/computer, hindi ang YouTube player"
  vi: "Giữ âm lượng video trên 50% — muốn yên lặng thì giảm âm lượng điện thoại/máy tính, không phải trình phát YouTube"

"480p 이상 화질로, 로그인한 계정으로 보기":
  en: "Watch in 480p or higher while logged in"
  ja: "480p以上の画質で、ログインした状態で見る"
  zh: "用 480p 以上画质、登录账号观看"
  es: "Mira en 480p o más con tu cuenta iniciada"
  id: "Tonton di kualitas 480p ke atas dan dalam keadaan login"
  th: "ดูที่ความละเอียด 480p ขึ้นไป และล็อกอินบัญชีไว้"
  pt: "Assista em 480p ou mais com a conta logada"
  fil: "Manood sa 480p pataas habang naka-log in"
  vi: "Xem ở chất lượng 480p trở lên và đăng nhập tài khoản"

