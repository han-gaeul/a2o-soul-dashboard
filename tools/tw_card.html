<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 트윗에 붙이는 이미지 (1200x675). tools/make_tw_cards.js가 ?kind=…로 열어 스크린샷 → site/img/tw/ -->
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 675px; overflow: hidden; }
  body { font-family: "Pretendard Variable", Pretendard, "Noto Sans CJK KR", sans-serif; color: #2a1d5c; position: relative;
    background: linear-gradient(120deg, #ffe3ec 0%, #f3d9ff 45%, #d9d4ff 100%); }
  body.views { background: linear-gradient(125deg, #5b3df5 0%, #8b46e6 55%, #c04fd6 100%); color: #fff; }
  .conf i { position: absolute; width: 14px; height: 22px; border-radius: 3px; opacity: .55; }
  .left { position: absolute; left: 80px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; width: 560px; }
  .views .left { width: 560px; }
  .emoji { font-size: 76px; line-height: 1; }
  .kicker { font-weight: 800; letter-spacing: .18em; font-size: 24px; color: #6c4cf5; }
  .views .kicker { color: #fff; opacity: .9; }
  .big { font-weight: 900; font-size: 78px; line-height: 1.05; letter-spacing: -.02em; }
  .views .big { font-size: 112px; white-space: nowrap; }
  .views .big small { display: inline; font-size: 52px !important; margin: 0 0 0 14px !important; font-weight: 800; }
  .mosaic { position: absolute; right: 60px; top: 70px; width: 500px; height: 520px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    transform: rotate(-4deg); }
  .mosaic img { width: 100%; height: 166px; object-fit: cover; object-position: center top; border-radius: 14px; border: 4px solid rgba(255,255,255,.6); }
  .views .big small { font-size: 64px; font-weight: 800; margin-left: 6px; }
  .sub { font-size: 30px; font-weight: 700; }
  .views .sub { opacity: .95; }
  .note { font-size: 24px; font-weight: 600; opacity: .8; }
  .tags { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .tags span { background: #6c4cf5; color: #fff; font-weight: 800; font-size: 20px; padding: 8px 16px; border-radius: 999px; }
  .views .tags span { background: rgba(255,255,255,.22); }
  .photo { position: absolute; right: 70px; top: 60px; width: 430px; height: 555px; border-radius: 28px; overflow: hidden;
    border: 10px solid rgba(255,255,255,.75); box-shadow: 0 18px 50px rgba(80,40,160,.25); background: #ddd; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .foot { position: absolute; left: 80px; right: 70px; bottom: 34px; display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; opacity: .75; }
  .bday .foot { right: 540px; } .views .foot { right: 70px; }
  .line { position: absolute; inset: 0; opacity: .14; }
  .win .wl { font-size: 26px; font-weight: 700; display: grid; gap: 6px; }
  body.win { background: linear-gradient(125deg, #f5b301 0%, #f06292 50%, #7b5cf5 100%); }
</style></head>
<body>
<div class="conf" id="conf"></div>
<div class="left" id="left"></div>
<div class="foot"><span>A2O SOUL</span><span>a2osoul-tracker.com</span></div>
<script>
  const q = new URLSearchParams(location.search), kind = q.get("kind");
  document.body.className = kind;
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // 색종이
  const cols = kind === "views" ? ["#fff", "#ffd6f2", "#c9bcff"] : ["#a78bfa", "#f9a8d4", "#93c5fd", "#fcd34d", "#fff"];
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 38; i++) {
    const c = document.createElement("i");
    Object.assign(c.style, { left: `${rnd() * 1200}px`, top: `${rnd() * 675}px`, background: cols[i % cols.length], transform: `rotate(${rnd() * 180}deg)` });
    conf.append(c);
  }
  if (kind === "bday") {  // ?kind=bday&ko=서하&en=SEOHA&date=01.01&img=../site/img/members/댄인닼_서하.webp
    left.innerHTML = `<div class="emoji">🎂</div><div class="kicker">HAPPY ${esc(q.get("en"))} DAY</div>
      <div class="big">${esc(q.get("ko"))}의<br>생일 축하해요!</div>
      <div class="sub">${esc(q.get("date"))} · A2O SOUL ${esc(q.get("en"))}</div>
      <div class="tags"><span>#Happy${esc(q.get("tag"))}Day</span><span>#${esc(q.get("ko"))}</span></div>`;
    const ph = document.createElement("div"); ph.className = "photo"; ph.innerHTML = `<img src="${esc(q.get("img"))}" alt="">`; document.body.append(ph);
  } else if (kind === "win") {  // ?kind=win&n=3&lines=더쇼 · 11.17|…&song=Dancing in the Dark&tags=#A2OSOUL3rdWin&imgs=…
    document.body.className = "views win";
    left.innerHTML = `<div class="emoji">🏆</div><div class="kicker">A2O SOUL · ${esc(q.get("song"))}</div>
      <div class="big">1위 ${esc(q.get("n"))}관왕!</div>
      <div class="wl">${(q.get("lines") || "").split("|").filter(Boolean).map((l) => `<div>🏆 ${esc(l)}</div>`).join("")}</div>
      <div class="tags">${(q.get("tags") || "").split(" ").filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join("")}</div>`;
    const mo = document.createElement("div"); mo.className = "mosaic";
    for (const src of (q.get("imgs") || "").split("|").filter(Boolean)) { const im = document.createElement("img"); im.src = src; mo.append(im); }
    document.body.append(mo);
  } else if (kind === "views") {  // ?kind=views&n=500&unit=만&song=Dancing in the Dark&label=Official MV
    left.innerHTML = `<div class="emoji">🎉</div><div class="kicker">A2O SOUL · ${esc(q.get("label"))}</div>
      <div class="big">${esc(q.get("n"))}<small>뷰 돌파!</small></div>
      <div class="sub">'${esc(q.get("song"))}' ${esc(q.get("label"))}</div>
      <div class="tags"><span>${esc(q.get("en"))} VIEWS</span><span>#${esc((q.get("song") || "").replace(/\s+/g, "_"))}</span></div>`;
    const mo = document.createElement("div"); mo.className = "mosaic";
    for (const src of (q.get("imgs") || "").split("|").filter(Boolean)) { const im = document.createElement("img"); im.src = src; mo.append(im); }
    document.body.append(mo);
  }
</script>
</body></html>
