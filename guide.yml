# steps: '덕질 처음이에요' 5단계 (아이콘, 제목, 한 줄 설명, 누르면 갈 곳: 탭 이름 또는 #섹션아이디). 체크는 각자 브라우저에 저장
steps:
  - { icon: "🎵", title: "노래부터 들어 보기", desc: "'SUPERSTAR'와 'Dancing in the Dark' 뮤직비디오 두 편이면 충분해요", go: "#course" }
  - { icon: "👀", title: "15명 얼굴 익히기", desc: "멤버 사진을 훑어보고, 퀴즈로 맞혀 보세요 — 틀려도 괜찮아요", go: "#quizSec" }
  - { icon: "⭐", title: "최애 정하기", desc: "직캠을 보다가 눈이 가는 멤버의 ☆를 누르면 사이트가 그 멤버 위주로 바뀌어요", go: "fancams" }
  - { icon: "🔔", title: "놓치지 않게 알림 켜기", desc: "위쪽 🔔 알림을 켜고 홈 화면에 설치하면 음방·투표를 알려 드려요", go: "#pushBtn" }
  - { icon: "💜", title: "응원 시작하기", desc: "응원 탭에서 스밍 리스트를 틀고, '이번 주 음방'에서 오늘 투표만 하면 돼요", go: "cheer" }
# faq: 처음 팬이 자주 묻는 것 (q, a)
faq:
  - { q: "돈을 꼭 써야 하나요?", a: "아니요. 영상 보기, 투표, 이 사이트는 모두 무료예요. 음원 스밍만 음원 사이트 이용권이 필요해요." }
  - { q: "투표가 너무 많은데 다 해야 하나요?", a: "아니요. 응원 탭 '이번 주 음방'에서 오늘 표시된 것만 해도 큰 힘이 돼요." }
  - { q: "한국어를 몰라도 되나요?", a: "네. 사이트는 오른쪽 위에서 언어를 바꿀 수 있고, 투표 앱 대부분은 구글·애플 계정으로 해외에서도 가입돼요." }
  - { q: "모르는 말이 나오면요?", a: "아래 '자주 쓰는 말'에 직캠·사녹·스밍 같은 말이 정리돼 있어요." }

beginner:
  - title: "덕질 처음이라면 — 첫 일주일"
    items:
      - "'SUPERSTAR'와 'Dancing in the Dark' 뮤직비디오 보기 (아래 입문 코스)"
      - "멤버 탭에서 15명 사진·프로필 훑어보기"
      - "멤버 맞히기 퀴즈로 얼굴 익히기"
      - "직캠 탭에서 마음 가는 멤버 직캠 보기 → 한눈에 탭에서 최애로 설정"
      - "응원 탭에서 캘린더 구독 → 음방·투표 마감이 휴대폰 캘린더에"
      - "홈 화면에 앱 설치 (오른쪽 위 '앱 설치')"
  - title: "공식 정보는 여기서"
    items:
      - "유튜브 A2O SOUL — 뮤직비디오·자체 콘텐츠"
      - "유튜브 A2O WORLD — 소속사 채널 (데뷔 전 연습생 영상도 여기)"
      - "인스타그램·X — 공지, 일정, 사진"
      - "플러스챗 — 멤버가 직접 보내는 메시지 (엠넷플러스 유료 구독)"
      - "링크는 멤버 탭 맨 위 '공식 채널'에 모여 있어요"
  - title: "자주 쓰는 말"
    items:
      - "직캠 — 한 멤버만 따라가며 찍은 무대 영상"
      - "음방 — 음악방송 (더쇼·쇼챔피언·엠카운트다운·뮤직뱅크·음악중심·인기가요)"
      - "사녹 — 음방 사전녹화 (팬이 직접 가서 보는 녹화)"
      - "스밍 — 음원 사이트에서 노래 스트리밍 (차트 순위에 반영)"
      - "1위 후보 — 음방에서 그 주 1위를 다투는 곡 (투표가 점수에 들어가요)"
      - "활동곡 — 음방 무대에서 부르는 곡 (지금은 'Dancing in the Dark')"
      - "포카 — 앨범에 랜덤으로 들어 있는 포토카드"
      - "팬싸·영통 — 앨범 구매로 응모하는 팬사인회·영상통화 이벤트"
      - "루키즈·LTB·HTB — 데뷔 전 연습생 시절 이름 (A2O Rookies)"
