# 일정 — 사이트의 "다가오는 일정"에 표시 (지난 일정은 자동으로 숨김)
# date: YYYY-MM-DD (KST), time: "HH:MM" (선택), type: 음방 | 라이브 | 발매 | 행사 | 기타
# url: 선택 (공식 공지 링크 등)
#
# 예)
#   - date: 2026-11-13
#     time: "17:00"
#     type: 음방
#     title: 뮤직뱅크 출연
#     url: https://...
#     credit: "@아이디"   # 선택 — 팬 제보로 넣었으면 '제보 @아이디'로 표시
events:
  # 팬사인회·영통 (팬 계정 정리 기준 — 공식 공지 링크가 생기면 url에 넣기)
  - { date: 2026-11-14, time: "19:30", type: 행사, title: Musicart 팬사인회, short: 팬싸 }
  - { date: 2026-11-15, time: "18:00", type: 행사, title: Mnet Plus 영상통화 팬사인회, short: 영통 }
  - { date: 2026-11-15, time: "20:00", type: 행사, title: Mnet Plus 팬사인회, short: 팬싸 }
  - { date: 2026-11-18, time: "19:00", type: 행사, title: Makestar 영상통화 팬사인회, short: 영통 }
  - { date: 2026-11-20, time: "20:00", type: 행사, title: Makestar 팬사인회, short: 팬싸 }
  - { date: 2026-11-21, time: "18:30", type: 행사, title: Withmuu 영상통화 팬사인회, short: 영통 }
  - { date: 2026-11-21, time: "20:30", type: 행사, title: Withmuu 팬사인회, short: 팬싸 }
  # 해외 팬 스밍 (A2OSOULSTATION 제공) — notify: 1시간 전 알림·트윗 초안
  - { date: 2026-11-23, time: "18:00", type: 행사, title: 스테이션헤드 합동 스밍 1부 (KO1KEYZ 스테이션), short: 스밍, url: "https://www.stationhead.com/ko1keyzstation2", notify: true, credit: "@a2osoulstation" }
  - { date: 2026-11-23, time: "19:30", type: 행사, title: 스테이션헤드 합동 스밍 2부 (A2O SOUL 스테이션), short: 스밍, url: "https://www.stationhead.com/a2osoulstation", notify: true, credit: "@a2osoulstation" }
  # 공식 영상
  - { date: 2026-11-16, time: "18:00", type: 기타, title: Dancing in the Dark 퍼포먼스 비디오 공개, url: "https://youtu.be/RRfoJjvqr7k" }
  # 연말 무대
  - { date: 2026-12-18, type: 음방, title: KBS 가요대축제 출연 }
  - { date: 2026-12-25, type: 음방, title: SBS 가요대전 출연 }

# 팬싸·영통 공지 카드(공지 탭) 손보기
#   fix: 제목에 match가 들어간 공지의 당첨 발표일(announce)·응모 기간 등을 고침 (같은 판매처가 여러 날이면 date로 구분)
#   add: 공지에서 자동으로 못 읽은 일정 추가 (지나면 자동으로 빠짐)
fansign:
  fix:
    - { match: Withmuu, announce: "2026-11-17" }
    - { match: Music Plant, announce: "2026-11-19 15:00" }
    - { match: Jumpup, apply_start: "2026-11-18 15:00", apply_end: "2026-11-20 23:59", announce: "2026-11-21 15:00" }
  add:
    - { date: 2026-11-29, time: "20:00", title: Jumpup 팬사인회, short: 팬싸, apply_start: "2026-11-18 15:00", apply_end: "2026-11-20 23:59", announce: "2026-11-21 15:00", post: "https://x.com/JumpUp_ent/status/2122932820913860808" }
