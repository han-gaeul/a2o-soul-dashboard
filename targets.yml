# A2O SOUL Tracker 추적 대상
# 이 파일을 고쳐서 커밋하면 사이트가 자동으로 다시 빌드돼요 (GitHub 웹에서 편집해도 됨).

debut_date: 2026-10-13

# 사이트 하단 '의견 보내기' 버튼 링크 (구글 폼 응답 링크 등). 비우면 버튼 숨김
feedback_url: "https://docs.google.com/forms/d/e/1FAIpQLSf6AiaTcOE6EUweWYeOUyMpUUgS6CGLwwYTEDbbgDCgIt8xyg/viewform"

# 유튜브 채널: 업로드 영상을 자동으로 찾아 등록 (데뷔 전 영상 포함)
#   id 또는 handle 중 하나
#   filter: 제목 필터. 비우면 전부 등록
#     soul  = 그룹명 + 멤버 이름(영문·한글) — 소속사 공용 채널용
#     group = 그룹명만                    — 음방 채널용 (다른 그룹 동명 멤버 방지)
#     그 외 = 정규식
#   kpi: 구독자 수를 대시보드 상단에 보여줄지
#   show: 음방 채널 이름 → 전체 영상 탭 '무대별' 필터
#   mv: true인 채널(공식 계정)에 올라온 MV만 MV로 집계, 유통사 등 다른 채널의 같은 MV는 콘텐츠로
#   자동 분류: 제목에 직캠/FanCam/Focus → 직캠(멤버 이름 하나면 그 멤버로),
#             60초 이하 → 콘텐츠(쇼츠), MV/M/V/Music Video → MV, 나머지 → 콘텐츠
channels:
  - id: UCAdLPETtxpZeRVqsq_QTneA   # A2O SOUL
    kpi: true
    mv: true
  - id: UCn-SYb1TUz-1itK_uz4imUA   # A2O WORLD (공용)
    filter: soul
    kpi: false
    mv: true
  # 음방 채널 — 직캠·무대 자동 수집
  - id: UCTQVIXvcHrR9jYoJ6qaBAow   # M2 (MPD직캠)
    filter: group
    kpi: false
    show: M2
  - id: UCbD8EppRX3ZwJSou-TVo90A   # Mnet K-POP (엠카운트다운)
    filter: group
    kpi: false
    show: 엠카운트다운
  - id: UCeLPm9yH_a_QH8n6445G-Ow   # KBS Kpop (뮤직뱅크)
    filter: group
    kpi: false
    show: 뮤직뱅크
  - id: UCe52oeb7Xv_KaJsEzcKXJJg   # MBCkpop (음악중심)
    filter: group
    kpi: false
    show: 음악중심
  - id: UCS_hnpJLQTvBkqALgapi_4g   # SBSKPOP X INKIGAYO (인기가요)
    filter: group
    kpi: false
    show: 인기가요
  - handle: ALLTHEKPOP             # ALL THE K-POP (쇼챔피언)
    filter: group
    kpi: false
    show: 쇼챔피언
  - handle: thekpop                # THE K-POP (더쇼)
    filter: group
    kpi: false
    show: 더쇼
  - handle: showkpop.official      # 아리랑TV SHOW K-POP
    filter: group
    kpi: false
    show: SHOW K-POP
  # 음원 유통사
  - id: UC_pwIXKXNm5KGhdEVzmY60A   # STONE MUSIC
    filter: group
    kpi: false

# 영상 자동 찾기 (YouTube 검색, every_hours마다 — 검색은 100유닛이라 자주 안 함)
#   규칙마다: query로 검색 → 제목에 그룹명 + title(정규식, 선택) + channels(채널 이름 정규식, 선택)이 맞는 영상만 등록
#   규칙을 바꾸면 다음 실행 때 데뷔일부터 다시 훑어서 지난 영상도 채움
discover:
  every_hours: 6
  days: 14
  rules:
    # 방송사 라디오·예능 출연 (리액션·팬 채널 제외)
    - query: "A2O SOUL"
      channels: &bc "(MBC|KBS|SBS|JTBC|Mnet|tvN|EBS|ENA)|라디오|RADIO|아리랑|Arirang|1theK|원더케이|딩고|Dingo|스튜디오 춤|STUDIO CHOOM|문명특급|주간아이돌|Weekly Idol|뮤플리|NAVER NOW|이지금|IDOL RADIO|Mhz|므흐즈"
    - query: "A2O SOUL 라디오|RADIO|보이는라디오|정오의 희망곡|아이돌 라디오"
      channels: *bc
    # 출근길·퇴근길 — 언론사·팬 채널 상관없이 제목에 출근길/퇴근길이 있으면
    - query: "A2O SOUL 출근길|퇴근길"
      title: "출근길|퇴근길|출퇴근|commute"

# 영상 시리즈 — 제목 정규식(대소문자 무시)으로 분류, 위에서부터 먼저 맞는 것 (전체 영상 탭 '시리즈' 필터)
series:
  - { name: 출근길·퇴근길, pattern: "출근길|퇴근길|출퇴근|commute" }
  - { name: 웰컴 투 소울라이트, pattern: "WELCOME TO SOULITE|Welcome to SOULITE" }
  - { name: INFINITE CLIP, pattern: "INFINITE CLIP" }
  - { name: 릴레이댄스, pattern: "릴레이댄스|릴댄" }
  - { name: Zal-Dance, pattern: "Zal-Dance" }
  - { name: Zal-Life, pattern: "Zal-Life" }
  - { name: 예능·라디오, pattern: "라디오|RADIO|핫클립|보이는 ?라디오|주간아이돌|Weekly Idol|문명특급|아는 ?형님|런닝맨|놀라운 ?토요일|정오의 희망곡|두시탈출|IDOL RADIO|아이돌 ?라디오" }
  - { name: 인터뷰, pattern: "인터뷰|Interview|MC석" }
  - { name: 비하인드, pattern: "BEHIND|Backstage|비하인드" }
  - { name: 티저·트레일러, pattern: "Teaser|Trailer|티저|Highlight Medley|Find the SOUL|Coming to You" }

