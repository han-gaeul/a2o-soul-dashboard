# A2O SOUL 멤버
#
# 매칭용
#   name: 사이트에 표시하는 이름 / ko: 한글 표기
#   aliases: 제목에 다르게 쓰이는 표기 (연습생 시절 이름 포함)
#   units: 데뷔 전 연습생 유닛(A2O Rookies LTB·HTB). since~until 기간 영상만 (없으면 제한 없음)
#          → 제목에 이름 없이 'A2O LTB'처럼 유닛만 있는 데뷔 전 영상도 해당 멤버에 연결
#   영문은 대소문자 구분 없이, 한글은 앞뒤에 다른 한글이 붙지 않은 경우만 인식 (예: '준비'의 '준'은 제외)
#
# 프로필 (멤버 팝업에 표시)
#   position, birth_year, nationality, nicknames, career(데뷔 전 경력), notes(여담)
#   미성년 멤버가 많아 활동 관련 정보만 — 본명·학교·가족·거주지·신체정보·출처 없는 소문은 넣지 않기
#
# 출처: 나무위키 각 멤버 문서와 'A2O Rookies' 인원 변천사 (2026-11-10 기준, 요약), kpopbio.com
#       틀린 게 있으면 고쳐주세요
# 그룹 공식 채널 (멤버 탭 상단에 표시). 멤버 개인 공식 SNS는 아직 없음
group_links:
  - { label: 공식 홈페이지, url: "https://a2osoul.world" }
  - { label: 인스타그램 @a2o.soul, url: "https://www.instagram.com/a2o.soul" }
  - { label: 유튜브 A2O SOUL, url: "https://www.youtube.com/@A2OSOUL" }
  - { label: 유튜브 A2O WORLD, url: "https://www.youtube.com/@A2OWORLD" }
  - { label: 플러스챗, url: "https://artist.mnetplus.world/main/stg/a2osoul" }
  - { label: A2O엔터테인먼트 아티스트 페이지, url: "https://www.a2oentertainment.world/artists/a2o-soul" }

