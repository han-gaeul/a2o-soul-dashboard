# A2O SOUL 멤버
#
# 매칭용
#   name: 사이트에 표시하는 이름 / ko: 한글 표기
#   aliases: 제목에 다르게 쓰이는 표기 (연습생 시절 이름 포함)
#   units: 데뷔 전 연습생 유닛(A2O Rookies LTB·HTB). since~until 기간 영상만 (없으면 제한 없음)
#          → 제목에 이름 없이 'A2O LTB'처럼 유닛만 있는 데뷔 전 영상도 해당 멤버에 연결
#   영문은 대소문자 구분 없이, 한글은 앞뒤에 다른 한글이 붙지 않은 경우만 인식 (예: '준비'의 '준'은 제외)
#
# 프로필 (멤버 팝업에 표시)
#   position, birth_year, nationality, nicknames, career(데뷔 전 경력), notes(여담)
#   미성년 멤버가 많아 활동 관련 정보만 — 학교·가족·거주지·신체정보·출처 없는 소문은 넣지 않기
#   real_name: 본명 (멤버가 공식 프로필·QQ뮤직 카드에서 직접 밝힌 것만, 운영자 결정 2026-11-24)
#   birthday: "MM-DD" → 프로필에 표시, 다가오는 일정에 생일 D-day 자동 (30일 전부터)
#   mbti: MBTI (멤버가 직접 밝힌 것만)
#   drawings: 멤버가 직접 그린 그림 [{src: img/drawings/파일, label: 출처, url: 출처 주소}]
#   signature: site/img/ 아래 서명 이미지 경로 (예: img/members/moon-sign.png)
#   서명 여러 장: site/img/members/ 에 '서명_이름' '사인_이름'처럼 올리면 모두 표시, 출처는 아래 signature_sources (라벨별)
#   profile_history: 역대 프로필 사진 목록. 항목마다 photo(site/img/ 경로) 또는 instagram(게시물 URL) 중 하나
#     예) profile_history:
#           - { label: 데뷔 프로필 (2026.10), photo: img/members/moon-2026-10.jpg }
#           - { label: "'Dancing in the Dark' 콘셉트", instagram: "https://www.instagram.com/p/XXXX/" }
#   color: 최애 테마 기본 색 ("#f4a3c0" 같은 색 코드). 없으면 파스텔 15색 중 순서대로
#   photo: site/img/members/ 에 올린 사진 파일 경로 (예: img/members/moon.jpg) → 멤버 카드 원형 아이콘·프로필에 표시
#          사용 권한이 있는 이미지만. 없으면 이니셜 아이콘
#   instagram_posts: 공식 계정(@a2o.soul 등) 인스타그램 게시물 URL 목록 → 프로필 팝업에 인스타그램 임베드로 표시
#     예) instagram_posts: ["https://www.instagram.com/p/XXXXXXXXXXX/"]
#     게시물 → ⋯ → 링크 복사로 얻은 주소. 원본이 삭제되면 임베드도 같이 사라짐
#
# 순서: 'Dancing in the Dark' 공식 응원법 멤버 콜 순서 (멤버 목록·띠 등이 이 순서로 보임)
# 포지션 일부(리더·에이스·콘셉트 센터 등)는 팬 제보 반영 (2026-11)
# 출처(생일 포함): 나무위키 각 멤버 문서와 'A2O Rookies' 인원 변천사 (2026-11-10 기준, 요약), kpopbio.com
#       틀린 게 있으면 고쳐주세요
# 그룹 공식 채널 (멤버 탭 상단에 표시). 멤버 개인 공식 SNS는 아직 없음
group_links:
  - { label: 공식 홈페이지, url: "https://a2osoul.world" }
  - { label: 인스타그램 @a2o.soul, url: "https://www.instagram.com/a2o.soul" }
  - { label: X @A2O_SOUL, url: "https://x.com/A2O_SOUL" }
  - { label: 유튜브 A2O SOUL, url: "https://www.youtube.com/@A2OSOUL" }
  - { label: 유튜브 A2O WORLD, url: "https://www.youtube.com/@A2OWORLD" }
  - { label: 플러스챗, url: "https://artist.mnetplus.world/main/stg/a2osoul" }
  - { label: A2O엔터테인먼트 아티스트 페이지, url: "https://www.a2oentertainment.world/artists/a2o-soul" }

# 그룹 공식 게시물 (멤버 탭 '공식 게시물'에 인스타그램 임베드로 표시). 단체 사진 게시물은 여기에
#   예) - "https://www.instagram.com/p/XXXXXXXXXXX/"
group_posts: []

