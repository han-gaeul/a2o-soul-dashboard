# 응원 탭 — 음방 투표·스밍 리스트
# GitHub 웹에서 편집해 커밋하면 1~2분 뒤 반영돼요.

# 투표: 진행 중·예정인 것만 표시되고, 마감되면 자동으로 숨겨져요. 캘린더 구독에도 마감 일정이 들어가요.
#   start / end: "YYYY-MM-DD HH:MM" (KST)
#   예)
#   - show: 인기가요
#     app: 아이돌챔프
#     title: 사전투표
#     start: "2026-11-12 18:00"
#     end: "2026-11-14 23:59"
#     url: https://...
votes:
  - show: 유픽
    app: 유픽(U+PICK)
    title: "11월 이달의 픽 · 루키 남자 (제트·서하 후보)"
    start: "2026-11-01 00:00"
    end: "2026-11-20 23:59"   # 마감 시각은 기사에 없어서 날짜 끝으로 — 앱에서 확인
    note: 부문 1위는 코엑스 미디어타워 전광판 광고

# 스밍 리스트: 위에서부터 순서대로 표시. links는 있는 것만
streaming:
  - title: Dancing in the Dark
    note: 지금 활동곡 (데뷔 미니앨범 더블 타이틀)
    links: { MV: "https://youtu.be/JPJokqIoIJI" }   # 예) 멜론: "https://...", Spotify: "https://..."
  - title: SUPERSTAR
    note: 선공개 싱글·데뷔 활동곡
    links: { MV: "https://youtu.be/IAURqrShEUQ", "INFINITE MV": "https://youtu.be/B5Aa4gnnt9I" }
