# 스밍 리스트 (응원 탭 '스밍 리스트' 맨 위) — 이 순서로 반복 재생. song마다 음원 사이트 검색 버튼이 자동으로 붙음
#   멜론 TOP100 = 24시간 이용자 수 + 1시간 이용량 50:50, 1시간 이용량은 한 계정이 한 곡을 1시간에 1번만 셈
#   → 소울 곡만 순서대로 계속 반복하면 매시간 모든 곡이 한 번씩 반영됨. 활동곡이 바뀌면 순서만 바꾸기
stream_playlist:
  title: 에투소 스밍 리스트
  desc: 한 바퀴 약 1시간 리스트예요. 아래 버튼으로 한 번에 담고 전체 반복으로 계속 틀어 주세요.
  # 곡 정보 — 원클릭 담기에 쓰는 곡 번호(각 사이트 곡 주소 끝 숫자)와 재생시간(m:ss)
  songs:
    Dancing in the Dark: { title: true, time: "2:48", melon: "603877088", genie: "117647941", bugs: "6516227", flo: "616833384" }
    Superstar: { title: true, time: "4:08", melon: "603382330", genie: "117256250", bugs: "6511884", flo: "611657166" }
    While We're Young: { time: "3:18", melon: "603877089", genie: "117647942", bugs: "6516228", flo: "616833385" }
    Very First Love: { time: "3:08", melon: "603877090", genie: "117647943", bugs: "6516229", flo: "616833386" }
    Moonlight Shadow: { time: "3:28", melon: "603877091", genie: "117647944", bugs: "6516230", flo: "616833387" }
  # 재생 순서 (같은 곡 여러 번 OK)
  tracks:   # 18곡 · 약 1시간 (활동곡 5 · Superstar 4 · 수록곡 각 3, 같은 곡 연달아 X)
    - Dancing in the Dark
    - Superstar
    - While We're Young
    - Very First Love
    - Dancing in the Dark
    - Moonlight Shadow
    - Superstar
    - Dancing in the Dark
    - While We're Young
    - Very First Love
    - Moonlight Shadow
    - Dancing in the Dark
    - Superstar
    - While We're Young
    - Dancing in the Dark
    - Very First Love
    - Moonlight Shadow
    - Superstar
  tips:
    - 담기 전에 재생목록을 비우고, 설정에서 '중복 곡 허용'을 켜 두기
    - 전체 반복 켜기, 셔플 끄기
    - 스트리밍 이용권으로 로그인한 상태에서, 음소거·볼륨 0 말고 작게라도 소리 켜기
    - 곡마다 하트(좋아요) 누르기
    - 이용권이 있는 음원 사이트가 여러 개면 사이트마다 각각 — 가족·친구 계정도 큰 힘이 돼요 (들은 사람 수가 중요)
    - 해외 팬은 Spotify·Apple Music·YouTube Music에서 — 국내 차트엔 안 들어가지만 글로벌 차트에 반영돼요

