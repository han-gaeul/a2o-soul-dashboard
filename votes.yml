# 응원 탭 — 음방 투표·스밍 리스트
# GitHub 웹에서 편집해 커밋하면 1~2분 뒤 반영돼요.

# 투표: 진행 중·예정인 것만 표시되고, 마감되면 자동으로 숨겨져요. 캘린더 구독에도 마감 일정이 들어가요.
#   start / end: "YYYY-MM-DD HH:MM" (KST)
#   예)
#   - show: 인기가요
#     app: 아이돌챔프
#     title: 사전투표
#     start: "2026-11-12 18:00"
#     end: "2026-11-14 23:59"
#     url: https://...
votes:
  - show: 유픽
    app: 유픽(U+PICK)
    title: "11월 이달의 픽 · 루키 남자 (제트·서하 후보)"
    start: "2026-11-01 00:00"
    end: "2026-11-20 23:59"   # 마감 시각은 기사에 없어서 날짜 끝으로 — 앱에서 확인
    note: 부문 1위는 코엑스 미디어타워 전광판 광고

# 스밍 리스트 (응원 탭 '스밍 리스트' 맨 위) — 이 순서로 반복 재생. song마다 음원 사이트 검색 버튼이 자동으로 붙음
#   멜론 TOP100 = 24시간 이용자 수 + 1시간 이용량 50:50, 1시간 이용량은 한 계정이 한 곡을 1시간에 1번만 셈
#   → 소울 곡만 순서대로 계속 반복하면 매시간 모든 곡이 한 번씩 반영됨. 활동곡이 바뀌면 순서만 바꾸기
stream_playlist:
  title: 에투소 스밍 리스트
  desc: 멜론 순위는 '24시간 동안 들은 사람 수'와 '1시간 이용량'을 반반 합쳐요. 1시간 이용량은 한 계정이 한 곡을 1시간에 1번만 세서, 소울 곡을 순서대로 계속 반복해 두면 매시간 모든 곡이 한 번씩 반영돼요.
  tracks:
    - song: Dancing in the Dark
    - song: Superstar
    - song: While We're Young
    - song: Very First Love
    - song: Moonlight Shadow
  tips:
    - 이 5곡을 위 순서대로 반복 재생 (셔플 끄기) — 같은 곡만 연달아 틀면 그 시간엔 1번만 세요
    - 스트리밍 이용권으로 로그인한 상태에서, 음소거·볼륨 0 말고 작게라도 소리 켜기
    - 곡마다 하트(좋아요) 누르기
    - 이용권이 있는 음원 사이트가 여러 개면 사이트마다 각각 — 가족·친구 계정도 큰 힘이 돼요 (들은 사람 수가 중요)
    - 해외 팬은 Spotify·Apple Music·YouTube Music에서 — 국내 차트엔 안 들어가지만 글로벌 차트에 반영돼요

# MV·영상 링크: 위에서부터 순서대로 표시. links는 있는 것만
streaming:
  - title: Dancing in the Dark
    note: 지금 활동곡 (데뷔 미니앨범 더블 타이틀)
    links: { MV: "https://youtu.be/JPJokqIoIJI" }   # 예) 멜론: "https://...", Spotify: "https://..."
  - title: SUPERSTAR
    note: 선공개 싱글·데뷔 활동곡
    links: { MV: "https://youtu.be/IAURqrShEUQ", "INFINITE MV": "https://youtu.be/B5Aa4gnnt9I" }
