# Spotify 누적 재생 수 하루 한 번 기록 → 사이트 차트에 누적·하루 재생 수
name: Spotify plays

on:
  schedule:
    - cron: "23 3 * * *"   # 매일 12:23 KST (Spotify 재생 수는 하루 한 번쯤 갱신)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify
  cancel-in-progress: false

jobs:
  plays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
      - name: Read Spotify plays
        run: python collector/spotify.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/spotify.json)" ]; then
            git add data/spotify.json
            git commit -m "Spotify 재생 수 기록"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
