name: Update dashboard

on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분 (음방 당일 공지 반영) — X는 since_id로 새 글만 읽어 비용 거의 그대로
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      rescan:
        description: "채널 업로드를 처음부터 다시 확인 (필터·멤버 표기 바꾼 뒤)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 대기열에서 기다리는 동안 다른 실행이 data를 커밋했을 수 있으니 트리거 시점이 아닌 최신 main으로
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # push(코드·targets.yml 수정)일 때는 수집 없이 다시 빌드만
      - name: Collect & build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://a2osoul-tracker.com/
        run: python collector/collect.py ${{ github.event_name == 'push' && '--build' || '' }} ${{ inputs.rescan && '--rescan' || '' }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git pull --rebase -X theirs   # 충돌 시 방금 수집한 data를 우선
            git push
          fi

      # 확신이 낮은 자동 수집 공지 항목 → '자동 수집 확인 필요' 이슈 하나로 계속 갱신
      - name: Review issue
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="자동 수집 확인 필요"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -s data/pending.md ]; then
            if [ -n "$NUM" ]; then gh issue edit "$NUM" --body-file data/pending.md
            else gh issue create --title "$TITLE" --body-file data/pending.md; fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "확인할 항목이 없어서 닫아요."
          fi

      # 손봐야 할 데이터(멤버 못 찾은 직캠, 멈춘 채널, 번역 빠짐 등) → '수집 점검' 이슈 하나로 계속 갱신
      - name: Health issue
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="수집 점검"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq '[.[] | select(.title == "수집 점검")][0].number')
          if [ -s data/health.md ]; then
            if [ -n "$NUM" ]; then gh issue edit "$NUM" --body-file data/health.md
            else gh issue create --title "$TITLE" --body-file data/health.md; fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "손볼 항목이 없어서 닫아요."
          fi

      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/dashboard.json data/calendar.ics _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
