<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2O SOUL Tracker</title>
<meta name="description" content="A2O SOUL 유튜브 지표를 매일 모아 보여주는 비공식 팬메이드 대시보드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>A2O SOUL <span class="dday" id="dday"></span></h1>
      <div class="meta" id="debut"></div>
    </div>
    <div class="meta" id="updated">불러오는 중…</div>
  </header>

  <div class="grid" id="kpis"></div>

  <section class="card">
    <h2>최신 영상</h2>
    <div class="videos" id="recent"></div>
  </section>

  <section class="card">
    <h2>MV 조회수 추이</h2>
    <div class="chart-box"><canvas id="mvChart"></canvas></div>
  </section>

  <div class="two">
    <section class="card">
      <h2>MV 순위</h2>
      <div id="mvTable"></div>
    </section>
    <section class="card">
      <h2>구독자 · 팔로워 추이</h2>
      <div class="chart-box"><canvas id="accountsChart"></canvas></div>
    </section>
  </div>

  <section class="card" id="fancamSection">
    <h2>멤버별 직캠 조회수</h2>
    <div class="chart-box" id="fancamBox"><canvas id="fancamChart"></canvas></div>
    <div id="fancamTable"></div>
  </section>

  <footer>
    비공식 팬메이드 사이트로, A2O엔터테인먼트와 관련이 없습니다.<br>
    데이터 출처: YouTube Data API · 하루 2회(KST 0시, 12시경) 갱신 · 증감은 직전 수집일 대비
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
