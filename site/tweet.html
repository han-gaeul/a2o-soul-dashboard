<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4cf5">
<meta name="robots" content="noindex">
<title>트윗 초안 · SOUL Tracker</title>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .tw { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 14px; }
  .tw h1 { font-size: 20px; margin: 0; }
  .tw label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .tw input, .tw textarea { font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
  .tw textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .tw .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tw button { font: inherit; font-size: 14px; font-weight: 700; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .tw button.go { background: var(--accent-bg); border-color: var(--accent-bg); color: #fff; }
  .tw button.go.sure { background: #c81e43; border-color: #c81e43; }
  .tw button:disabled { opacity: .5; cursor: default; }
  .tw .msg { font-size: 14px; margin: 0; min-height: 1.3em; }
  .tw .msg.err { color: var(--hot); }
  .tw .card { display: grid; gap: 8px; }
  .tw .card.done { opacity: .55; }
  .tw .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .tw .cnt.over { color: #c81e43; font-weight: 700; }
  .tw .warn { background: #fff4e5; color: #8a4b00; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
</style>
</head>
<body>
<main class="tw">
  <h1>✍️ 트윗 초안</h1>
  <p class="muted small" style="margin:0">투표 마감·음방·차트·새 영상 등 알림이 생기면 초안이 여기 쌓여요. 확인하고 고쳐서 올리거나 버리세요. 초안은 3일 뒤 사라져요.</p>
  <label>관리 비밀번호 <input id="key" type="password" autocomplete="current-password"></label>
  <div class="row">
    <button type="button" id="load">불러오기</button>
    <button type="button" id="notify">🔔 이 기기에서 초안 알림 받기</button>
    <button type="button" id="notifyOff" hidden>알림 끄기</button>
  </div>
  <div class="row" id="acctRow" hidden>
    <span class="muted small" id="acct"></span>
    <button type="button" id="connect">X 계정 연결</button>
    <button type="button" id="disconnect" hidden>연결 해제</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
  <div id="warn"></div>
  <div id="list" style="display:grid;gap:12px"></div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch (_) { return ""; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };
  let api = "", vapid = "";
  const msg = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "msg err" : "msg"; };
  const call = async (path, body) => {
    const r = await fetch(api + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: $("key").value, ...body }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.status);
    return j;
  };
  // X 글자 수: 한글·한자·이모지 2, 그 외 1, 링크는 23 (최대 280)
  const weight = (s) => {
    let n = 0;
    const text = s.replace(/https?:\/\/\S+/g, () => { n += 23; return ""; });
    for (const ch of text) {
      const c = ch.codePointAt(0);
      n += (c <= 4351 || (c >= 8192 && c <= 8205) || (c >= 8208 && c <= 8223) || (c >= 8242 && c <= 8247)) ? 1 : 2;
    }
    return n;
  };
  const KIND = { vote: "🗳 투표", show: "📺 음방·라이브", nominee: "🏆 1위 후보", chart: "📈 차트", views: "🎉 조회수", subs: "🎉 구독자",
    birthday: "🎂 생일", video: "🎬 새 영상", prerec: "🎙 사녹" };
  const STATUS = { pending: "", posted: "✅ 올림", skipped: "버림" };
  const when = (ms) => new Date(ms).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Seoul" });

  const card = (d) => {
    const done = d.status !== "pending";
    const ta = document.createElement("textarea"); ta.value = d.text; ta.disabled = done;
    const cnt = document.createElement("span"); cnt.className = "cnt";
    const upd = () => { const w = weight(ta.value); cnt.textContent = `${w}/280`; cnt.classList.toggle("over", w > 280); };
    ta.oninput = upd; upd();
    const meta = document.createElement("div"); meta.className = "meta";
    const l = document.createElement("span"); l.textContent = `${KIND[d.kind] || d.kind} · ${when(d.at)} ${STATUS[d.status] || ""}`;
    meta.append(l, cnt);
    const box = document.createElement("div"); box.className = "card" + (done ? " done" : "");
    box.append(meta, ta);
    if (d.status === "posted" && d.tweet) {
      const a = document.createElement("a"); a.href = `https://x.com/i/status/${d.tweet}`; a.target = "_blank"; a.rel = "noopener"; a.textContent = "올린 글 보기 ↗";
      box.append(a);
    }
    if (!done) {
      const go = document.createElement("button"); go.type = "button"; go.className = "go"; go.textContent = "올리기";
      const skip = document.createElement("button"); skip.type = "button"; skip.textContent = "버리기";
      let sure = false;
      go.onclick = async () => {
        if (weight(ta.value) > 280) return msg("280자를 넘었어요", true);
        if (!sure) { sure = true; go.classList.add("sure"); go.textContent = "한 번 더 누르면 올라가요"; setTimeout(() => { sure = false; go.classList.remove("sure"); go.textContent = "올리기"; }, 4000); return; }
        go.disabled = skip.disabled = true;
        try { await call("/tweet/post", { id: d.id, text: ta.value }); msg("✅ 올렸어요"); load(); }
        catch (e) { msg(e.message, true); go.disabled = skip.disabled = false; }
      };
      skip.onclick = async () => { skip.disabled = true; try { await call("/tweet/skip", { id: d.id }); load(); } catch (e) { msg(e.message, true); skip.disabled = false; } };
      const row = document.createElement("div"); row.className = "row"; row.append(go, skip);
      box.append(row);
    }
    return box;
  };

  const load = async () => {
    if (!api) return;
    try {
      const j = await call("/tweet/list", {});
      store.set("tw_key", $("key").value);
      $("warn").replaceChildren();
      $("acctRow").hidden = false;
      $("acct").textContent = j.account ? `올릴 계정: @${j.account.replace(/^@/, "")}` : "올릴 계정: 없음";
      $("connect").textContent = j.connected ? "다른 계정으로 바꾸기" : "X 계정 연결";
      $("disconnect").hidden = !j.connected;
      if (!j.ready) { const w = document.createElement("div"); w.className = "warn"; w.textContent = "X 계정이 아직 연결되지 않아서 올리기는 안 돼요 — 'X 계정 연결'을 눌러 올릴 계정으로 로그인해 주세요"; $("warn").append(w); }
      const ds = j.drafts || [];
      const pend = ds.filter((d) => d.status === "pending").length;
      msg((back ? back + " · " : "") + (ds.length ? `올릴 초안 ${pend}개` : "아직 초안이 없어요"));
      $("list").replaceChildren(...ds.sort((a, b) => (a.status === "pending") === (b.status === "pending") ? b.at - a.at : a.status === "pending" ? -1 : 1).map(card));
    } catch (e) { msg(e.message, true); }
  };

  const keyBytes = (b64) => { const s = atob((b64 + "===".slice((b64.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, (c) => c.charCodeAt(0)); };
  const subscribe = async (off) => {
    try {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) throw new Error("이 브라우저는 알림을 못 받아요 (아이폰은 홈 화면에 추가한 앱에서)");
      if (!off && (await Notification.requestPermission()) !== "granted") throw new Error("알림 권한을 허용해 주세요");
      const reg = await navigator.serviceWorker.register("sw.js");
      await navigator.serviceWorker.ready;
      const sub = (await reg.pushManager.getSubscription()) || (off ? null : await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(vapid) }));
      if (!sub) return msg("알림이 꺼져 있어요");
      await call("/subscribe", off ? { sub: sub.toJSON(), tweetOff: true } : { sub: sub.toJSON(), topics: ["tweet"] });
      store.set("tw_notify", off ? "" : "1");
      $("notifyOff").hidden = !!off;
      msg(off ? "초안 알림을 껐어요" : "🔔 이 기기로 초안 알림이 와요");
    } catch (e) { msg(e.message, true); }
  };

  // X 계정 연결: 누르면 X 로그인 → 허용 → 이 페이지로 돌아옴 (?x=결과)
  $("connect").onclick = async () => { try { const j = await call("/tweet/connect", {}); location.href = j.url; } catch (e) { msg(e.message, true); } };
  $("disconnect").onclick = async () => { try { await call("/tweet/disconnect", {}); msg("연결을 해제했어요"); load(); } catch (e) { msg(e.message, true); } };
  const back = new URLSearchParams(location.search).get("x");
  if (back) { history.replaceState(null, "", location.pathname); setTimeout(() => msg(back), 0); }
  $("key").value = store.get("tw_key");
  $("notifyOff").hidden = !store.get("tw_notify");
  $("load").onclick = load;
  $("key").onkeydown = (e) => { if (e.key === "Enter") load(); };
  $("notify").onclick = () => subscribe(false);
  $("notifyOff").onclick = () => subscribe(true);
  fetch("data/dashboard.json").then((r) => r.json()).then((d) => {
    api = ((d.push || {}).api || "").replace(/\/$/, "");
    vapid = (d.push || {}).vapid_public || "";
    if ($("key").value) load();
  });
})();
</script>
</body>
</html>
